version: '3.8'

services:
  db:
    image: postgres:15
    container_name: new_bot_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    container_name: bot_redis
    restart: always
    ports:
      - "6379:6379"
  
  bot:
    build: .
    container_name: new_tg_bot
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env

volumes:
  pgdata: